<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merpati Ridge — Ring Runner</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1622;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .panel { position: absolute; top: 14px; background: rgba(8, 18, 30, .55);
    border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 10px 14px;
    backdrop-filter: blur(2px); }
  #panel-left { left: 14px; min-width: 168px; }
  #panel-right { right: 14px; min-width: 190px; }
  .row { display: flex; justify-content: space-between; gap: 18px;
    font-size: 17px; line-height: 1.55; letter-spacing: .04em; }
  .row span { color: #ffd34d; font-weight: 600; }
  .row b { font-variant-numeric: tabular-nums; }
  .bar-label { font-size: 13px; letter-spacing: .08em; color: #ffd34d;
    display: flex; justify-content: space-between; margin-top: 4px; }
  .bar-label b { color: #fff; }
  .bar { height: 10px; background: rgba(255,255,255,.22); border-radius: 5px;
    overflow: hidden; margin: 2px 0 6px; }
  .bar div { height: 100%; background: #4fc3f7; border-radius: 5px; }
  #bar-fuel { background: #ffd34d; }
  #compass { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(8, 18, 30, .55); border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: 6px 14px; font-size: 15px; letter-spacing: .12em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #attitude { position: absolute; left: 14px; bottom: 14px; background: rgba(8,18,30,.55);
    border: 1px solid rgba(255,255,255,.25); border-radius: 50%; }
  #mission { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(8, 18, 30, .6); border: 1px solid rgba(255,211,77,.6);
    border-radius: 8px; padding: 8px 18px; font-size: 16px; font-weight: 600;
    letter-spacing: .05em; white-space: nowrap; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    font-size: 34px; font-weight: 800; color: #ffd34d; letter-spacing: .06em;
    text-shadow: 0 2px 10px rgba(0,0,0,.9); white-space: nowrap; }
  #banner:empty { display: none; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 22px; color: rgba(255,255,255,.75); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(6, 12, 22, .45); z-index: 5; }
  .card { background: rgba(10, 22, 38, .88); border: 1px solid #ffd34d;
    border-radius: 14px; padding: 28px 36px; max-width: 560px; color: #eef3f8;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .card h1 { margin: 0; font-size: 40px; letter-spacing: .08em; color: #ffd34d; }
  .card h2 { margin: 2px 0 14px; font-size: 22px; letter-spacing: .3em; color: #9fd4e8; }
  .card p { font-size: 16px; line-height: 1.5; }
  .card table { margin: 10px auto; border-collapse: collapse; font-size: 15px; text-align: left; }
  .card td { padding: 3px 12px; }
  .card td:first-child { color: #ffd34d; font-weight: 700; white-space: nowrap; }
  .cta { color: #ffd34d; font-weight: 700; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Merpati Ridge Ring Runner: fly the propeller plane through six rings over the river valley, then land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<div id="overlay"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
